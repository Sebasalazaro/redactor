name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to a commit; Dependabot keeps them current.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # pyke's CDN blocks GitHub's runners (pykeio/ort#672): take ONNX
      # Runtime from this repo's mirror, checked against ort's pinned hash.
      - name: Preload ONNX Runtime
        shell: bash
        working-directory: .
        run: |
          echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort" >> "$GITHUB_ENV"
          py=$(command -v python3 || command -v python)
          "$py" -I scripts/ci/fetch-ort.py "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/ort"
      # ort's copy-dylibs copies DLLs into examples/ and deps/ without
      # creating them, and with Cargo's newer build-dir layout it aims one
      # level too deep, at target/<profile>/build (pykeio/ort#619).
      - name: Create the dylib folders ort copies into
        shell: bash
        working-directory: .
        run: mkdir -p target/debug/{,build/}{examples,deps}
      # Default members: redactor-core, redactor-cli and redactor-ner.
      # Excel support is a core feature only the desktop app turns on.
      - run: cargo test --all-targets --features redactor-core/xlsx
      - run: cargo test --doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # pyke's CDN blocks GitHub's runners (pykeio/ort#672): take ONNX
      # Runtime from this repo's mirror, checked against ort's pinned hash.
      - name: Preload ONNX Runtime
        shell: bash
        working-directory: .
        run: |
          echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort" >> "$GITHUB_ENV"
          py=$(command -v python3 || command -v python)
          "$py" -I scripts/ci/fetch-ort.py "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/ort"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets

  # Known vulnerabilities (RustSec), licenses and crate sources; see deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources bans

  desktop:
    name: desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # pyke's CDN blocks GitHub's runners (pykeio/ort#672): take ONNX
      # Runtime from this repo's mirror, checked against ort's pinned hash.
      - name: Preload ONNX Runtime
        shell: bash
        working-directory: .
        run: |
          echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort" >> "$GITHUB_ENV"
          py=$(command -v python3 || command -v python)
          "$py" -I scripts/ci/fetch-ort.py "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/ort"
      # ort's copy-dylibs copies DLLs into examples/ and deps/ without
      # creating them, and with Cargo's newer build-dir layout it aims one
      # level too deep, at target/<profile>/build (pykeio/ort#619).
      - name: Create the dylib folders ort copies into
        shell: bash
        working-directory: .
        run: mkdir -p target/debug/{,build/}{examples,deps}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build # svelte-check + vite build
      - run: cargo clippy -p redactor-desktop --all-targets
      - run: cargo test -p redactor-desktop
