name: Release

# Pushing a tag like v0.1.0 builds everything and publishes a GitHub release.
# Running it by hand (Actions > Release > Run workflow) only builds the
# artifacts, so the pipeline can be tested without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p redactor-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=redactor-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name"/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/redactor.exe "$name"/
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp target/${{ matrix.target }}/release/redactor "$name"/
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            redactor-*.tar.gz*
            redactor-*.zip*

  desktop:
    name: desktop (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build --bundles app,dmg
        working-directory: apps/desktop
      - name: Package
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          out="redactor-desktop-${GITHUB_REF_NAME}-aarch64.dmg"
          mv "$dmg" "$out"
          shasum -a 256 "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: redactor-desktop-*

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          **CLI:** download the archive for your platform, unpack it and put
          `redactor` on your `PATH`. Check it with the matching `.sha256` file.

          **Desktop (macOS, Apple Silicon):** open the `.dmg` and drag
          redactor to Applications. The app is not signed with an Apple
          Developer ID yet, so the first time right-click it and choose
          *Open*, or run `xattr -dr com.apple.quarantine /Applications/redactor.app`.

          **AI deep scan (optional):** run `scripts/fetch-model.sh` from the
          repository to install the local model.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
