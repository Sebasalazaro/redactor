name: Release

# Pushing a tag like v0.1.0 builds everything and publishes a GitHub release.
# Running it by hand (Actions > Release > Run workflow) only builds the
# artifacts, so the pipeline can be tested without publishing anything.
# See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit; Dependabot keeps them current.
jobs:
  cli:
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p redactor-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name=redactor-${GITHUB_REF_NAME}-${TARGET}
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name"/
          if [[ "$TARGET" == *windows* ]]; then
            cp target/$TARGET/release/redactor.exe "$name"/
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/$TARGET/release/redactor "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            redactor-*.tar.gz
            redactor-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: |
            redactor-*.tar.gz
            redactor-*.zip

  desktop-macos:
    name: desktop (macOS, Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build --bundles app,dmg -- --locked
        working-directory: apps/desktop
      - name: Package
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mv "$dmg" "redactor-desktop-${GITHUB_REF_NAME}-aarch64.dmg"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: redactor-desktop-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: redactor-desktop-*

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat .github/release-install.md >> notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: dist/*
