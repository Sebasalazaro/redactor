[package]
name = "redactor-core"
description = "Offline engine that redacts sensitive data from HTTP traffic before it is shared with an LLM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Stores the vault key in the OS keychain (macOS Keychain, Windows
# Credential Manager, Linux kernel keyring).
keychain = ["dep:keyring"]

[dependencies]
aes-gcm.workspace = true
aho-corasick.workspace = true
keyring = { workspace = true, optional = true }
base64.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
