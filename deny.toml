# cargo-deny: run `cargo deny check` locally; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Every vulnerability fails the build unless it is listed here with a reason.
ignore = []
# Unmaintained crates fail the build only when redactor depends on them
# directly; deep in Tauri's or tokenizers' trees they are reported upstream.
unmaintained = "workspace"

[licenses]
# Permissive licenses only, compatible with MIT OR Apache-2.0.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
